<style>
/* ============================================================
   主题变量 —— 5 个主题，每个都有鲜明性格
   切换：html[data-theme="xxx"]，点右上角主题切换器
   ============================================================ */

/* —— 默认 / sticky：经典便利贴 —— */
:root,
[data-theme="sticky"]{
  --bg:#f5f1e8;                 /* 软木板底色 */
  --bg-grad:radial-gradient(circle at 20% 10%, #efe6d3 0, #e8dcc0 60%, #ddd0b0 100%);
  --card:#fff7c2;               /* 便利贴黄 */
  --card-alt:#ffd9d9;           /* 粉便签 */
  --card-alt2:#cdebc8;          /* 绿便签 */
  --card-alt3:#cfe8ff;          /* 蓝便签 */
  --text:#3a2f1a;
  --muted:#7a6a4a;
  --accent:#d97706;             /* 胶带橙 */
  --accent-soft:#fef3c7;
  --border:#e0d4a8;
  --title-font:"Bradley Hand","Segoe Print","Marker Felt","STXingkai",cursive;
  --body-font:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --card-shadow:2px 4px 10px rgba(120,90,30,.18), 0 1px 2px rgba(0,0,0,.06);
  --card-rotate:0;
  --radius:2px;
  --sidebar-bg:rgba(120,90,50,.06);
}

/* —— paper：牛皮纸笔记本 —— */
[data-theme="paper"]{
  --bg:#e8dcc0;

  --muted:#8a6d4a;

  --accent-soft:#f0e0c0;
  --border:#cdb98a;
  --title-font:"Georgia","Times New Roman","Songti SC",serif;
  --body-font:"Georgia","Songti SC",serif;
  --card-shadow:1px 2px 4px rgba(80,60,30,.15);
  --card-rotate:0;
  --radius:4px;
  --sidebar-bg:rgba(139,44,26,.05);
}

/* —— morandi：莫兰迪柔色 —— */
[data-theme="morandi"]{

  --card-rotate:0;
  --radius:14px;
  --sidebar-bg:rgba(90,80,72,.04);
}

/* —— neon：深色霓虹 —— */
[data-theme="neon"]{
  --bg:#0d0d1a;
  --bg-grad:radial-gradient(circle at 80% 10%, #1a1a2e 0, #0d0d1a 100%);
  --card:#161628;

  --title-font:"JetBrains Mono","Fira Code","Consolas",monospace;

  --card-shadow:0 0 0 1px rgba(0,255,200,.15), 0 4px 20px rgba(0,255,200,.08);
  --card-rotate:0;
  --radius:10px;
  --sidebar-bg:rgba(0,255,200,.03);

/* —— clean：极简白 —— */
[data-theme="clean"]{
  --bg:#fafafa;
  --bg-grad:#fafafa;
  --card:#ffffff;
  --card-alt:#ffffff;
  --card-alt2:#ffffff;
  --card-alt3:#ffffff;

  --muted:#6b7280;

  --accent-soft:#eef2ff;

/* ============================================================
   基础
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body-font);
  background:var(--bg-grad);
  color:var(--text);
  font-size:15px;line-height:1.6;
  min-height:100vh;
  transition:background .4s,color .3s;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* 软木板纹理（仅 sticky 主题） */
[data-theme="sticky"] body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(circle at 25% 30%, rgba(150,110,50,.08) 1px, transparent 2px),
    radial-gradient(circle at 75% 60%, rgba(150,110,50,.06) 1px, transparent 2px);
  background-size:30px 30px, 40px 40px;
}
/* 纸张噪点（paper） */
[data-theme="paper"] body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
  background-image:radial-gradient(circle at 50% 50%, rgba(139,44,26,.03) 1px, transparent 1.5px);
  background-size:4px 4px;
}
/* 莫兰迪颗粒 */
[data-theme="morandi"] body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:radial-gradient(circle at 50% 50%, rgba(90,80,72,.04) 1px, transparent 1px);
  background-size:5px 5px;
}
/* 霓虹网格 */
[data-theme="neon"] body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
  background-image:
    linear-gradient(rgba(0,255,200,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,200,.04) 1px, transparent 1px);
  background-size:40px 40px;
}

/* ============================================================
   顶部栏（主题切换器）
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 32px;background:var(--card);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(8px);
}
.topbar .brand{font-family:var(--title-font);font-size:20px;font-weight:700;margin:0}
.topbar .brand .dot{color:var(--accent)}
.theme-switcher{position:relative}
.theme-trigger{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  padding:6px 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--card);color:var(--text);font-size:13px;font-family:inherit;
  transition:border-color .15s;
}
.theme-trigger:hover{border-color:var(--accent)}
.theme-trigger .swatch{
  width:16px;height:16px;border-radius:4px;border:1px solid var(--border);
  background:linear-gradient(135deg,#fff7c2,#ffd9d9,#cdebc8);
}
.theme-trigger .caret{font-size:10px;transition:transform .2s}
.theme-switcher.open .theme-trigger .caret{transform:rotate(180deg)}
.theme-panel{
  position:absolute;top:calc(100% + 8px);right:0;z-index:60;
  min-width:280px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.15);
  padding:14px;display:none;
}
.theme-switcher.open .theme-panel{display:block;animation:pop .18s ease}
.theme-panel-group{margin-bottom:12px}
.theme-panel-group:last-child{margin-bottom:0}
.theme-panel-title{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin:0 0 8px;padding:0 4px;
}
.theme-panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.theme-opt{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
  cursor:pointer;border:1px solid transparent;transition:all .12s;
  font-size:13px;color:var(--text);
}
.theme-opt:hover{background:var(--accent-soft)}
.theme-opt.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.theme-opt .dot{
  width:18px;height:18px;border-radius:5px;flex-shrink:0;border:1px solid var(--border);
}
.theme-opt .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme-opt .emoji{font-size:14px}
/* 各主题色块预览 */
.theme-opt[data-t="sticky"] .dot{background:#fff7c2}
.theme-opt[data-t="paper"] .dot{background:#fdf6e3}
.theme-opt[data-t="morandi"] .dot{background:#d5d0db}
.theme-opt[data-t="neon"] .dot{background:#161628}
.theme-opt[data-t="clean"] .dot{background:#ffffff}
.theme-opt[data-t="sage"] .dot{background:#9CAF88}
.theme-opt[data-t="ocean"] .dot{background:#0077B6}
.theme-opt[data-t="terracotta"] .dot{background:#9A3412}
.theme-opt[data-t="periwinkle"] .dot{background:#8B5CF6}
.theme-opt[data-t="darkacademia"] .dot{background:#241e18}
.theme-opt[data-t="slate"] .dot{background:#2F4F4F}

/* ============================================================
   布局
   ============================================================ */
.layout{display:flex;min-height:calc(100vh - 60px);position:relative;z-index:1}
.sidebar{
  width:260px;flex-shrink:0;
  background:var(--sidebar-bg);
  border-right:1px solid var(--border);
  padding:24px 20px;position:sticky;top:60px;
  height:calc(100vh - 60px);overflow-y:auto;
}
.main{flex:1;min-width:0;padding:32px 40px}

/* —— 侧栏 —— */
.tagline{font-size:12px;color:var(--muted);margin:0 0 24px;font-style:italic}
.search{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;font-family:inherit;background:var(--card);color:var(--text);
  margin-bottom:20px;outline:none;transition:border-color .15s;
}
.search:focus{border-color:var(--accent)}
.nav-group{margin-bottom:18px}
.nav-title{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin:0 0 6px;padding:0 8px;
}
.nav-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--text);
  font-size:14px;transition:background .12s;
}
.nav-item:hover{background:var(--accent-soft)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .count{font-size:12px;color:var(--muted);background:var(--card);padding:1px 7px;border-radius:10px;border:1px solid var(--border)}
.nav-item.active .count{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.nav-sub{padding-left:14px}
.nav-sub .nav-item{font-size:13px;color:var(--muted)}
.nav-sub .nav-item.active{color:var(--accent)}

/* ============================================================
   卡片网格
   ============================================================ */
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:8px}
.header h1{font-family:var(--title-font);font-size:26px;margin:0;font-weight:700}
.header .meta{font-size:13px;color:var(--muted)}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px;
}
.empty{
  grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted);
}
.empty .big{font-size:48px;margin-bottom:8px}

/* —— 卡片 —— */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--card-shadow);
  transition:transform .2s ease, box-shadow .2s;
  position:relative;
}
.card:hover{transform:translateY(-3px) rotate(var(--card-rotate));box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-title{font-family:var(--title-font);font-size:17px;font-weight:700;margin:0;color:var(--text);word-break:break-word;line-height:1.3}
.card-cat{
  font-size:11px;color:var(--muted);background:var(--accent-soft);
  padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;
  border:1px solid var(--border);
}
.card-summary{font-size:13.5px;color:var(--text);margin:0;opacity:.85}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-size:11px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);
  color:var(--accent);border:1px solid var(--border);
}
.card-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.link-btn{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;
  padding:5px 11px;border:1px solid var(--border);border-radius:6px;
  color:var(--text);background:var(--card);transition:all .12s;
}
.link-btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none;transform:translateY(-1px)}
.link-btn::before{content:"🔗";font-size:11px}
.card-foot{
  margin-top:auto;padding-top:8px;border-top:1px dashed var(--border);
  font-size:11px;color:var(--muted);
}
.card-foot a{color:var(--muted)}
.card-foot a:hover{color:var(--accent)}

/* —— 主题专属卡片装饰 —— */
/* sticky：胶带角 + 微旋 */
[data-theme="sticky"] .card:nth-child(4n+1){background:var(--card)}
[data-theme="sticky"] .card:nth-child(4n+2){background:var(--card-alt)}
[data-theme="sticky"] .card:nth-child(4n+3){background:var(--card-alt2)}
[data-theme="sticky"] .card:nth-child(4n){background:var(--card-alt3)}
[data-theme="sticky"] .card::before{
  content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:56px;height:18px;background:rgba(217,119,6,.35);
  border-left:1px dashed rgba(217,119,6,.3);border-right:1px dashed rgba(217,119,6,.3);
}
[data-theme="sticky"] .card:nth-child(odd){transform:rotate(-1deg)}
[data-theme="sticky"] .card:nth-child(even){transform:rotate(1deg)}
[data-theme="sticky"] .card:hover{transform:rotate(0) translateY(-4px)}

/* paper：左侧红线 + 衬线 */
[data-theme="paper"] .card{border-left:3px solid var(--accent)}
[data-theme="paper"] .card-head::after{content:none}

/* morandi：圆角大 + 无边框柔影 */
[data-theme="morandi"] .card{border:none;box-shadow:0 4px 12px rgba(90,80,72,.06)}
[data-theme="morandi"] .card:nth-child(4n+1){background:var(--card)}
[data-theme="morandi"] .card:nth-child(4n+2){background:var(--card-alt)}
[data-theme="morandi"] .card:nth-child(4n+3){background:var(--card-alt2)}
[data-theme="morandi"] .card:nth-child(4n){background:var(--card-alt3)}
[data-theme="morandi"] .card:hover{box-shadow:0 8px 24px rgba(90,80,72,.12)}

/* neon：发光边框 + 角标 */
[data-theme="neon"] .card{border:1px solid rgba(0,255,200,.2)}
[data-theme="neon"] .card:hover{box-shadow:0 0 0 1px var(--accent), 0 0 24px rgba(0,255,200,.3)}
[data-theme="neon"] .card-title{text-shadow:0 0 12px rgba(0,255,200,.5)}
[data-theme="neon"] .card-cat{background:rgba(0,255,200,.1);color:var(--accent);border-color:rgba(0,255,200,.3)}
[data-theme="neon"] .tag{background:rgba(0,255,200,.08);color:var(--accent);border-color:rgba(0,255,200,.2)}
[data-theme="neon"] .link-btn{background:#0d0d1a;border-color:rgba(0,255,200,.2)}
[data-theme="neon"] .link-btn::before{content:"▸";color:var(--accent)}
[data-theme="neon"] .card::before{
  content:"";position:absolute;top:0;right:0;width:0;height:0;
  border-style:solid;border-width:0 16px 16px 0;
  border-color:transparent var(--accent) transparent transparent;
  opacity:.6;
}

/* sage：左侧叶脉细线 + 微暖卡 */
[data-theme="sage"] .card{border-left:3px solid var(--accent)}
[data-theme="sage"] .card:nth-child(even){background:var(--card-alt)}

/* ocean：顶部细蓝条 + 层次感 */
[data-theme="ocean"] .card{border-top:3px solid var(--accent)}
[data-theme="ocean"] .card:nth-child(3n+2){background:var(--card-alt)}
[data-theme="ocean"] .card:nth-child(3n){background:var(--card-alt2)}

/* terracotta：手作感粗边 + 暖色交替 */
[data-theme="terracotta"] .card{border:1px solid var(--border);border-left:4px solid var(--accent)}
[data-theme="terracotta"] .card:nth-child(even){background:var(--card-alt)}

/* periwinkle：大圆角柔影 + 渐变标题色 */
[data-theme="periwinkle"] .card{border:none}
[data-theme="periwinkle"] .card-title{background:linear-gradient(135deg,var(--accent),#C4B5FD);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
[data-theme="periwinkle"] .card:nth-child(3n+1){background:var(--card)}
[data-theme="periwinkle"] .card:nth-child(3n+2){background:var(--card-alt)}
[data-theme="periwinkle"] .card:nth-child(3n){background:var(--card-alt2)}

/* darkacademia：羊皮纸卡 + 金色发丝线 + 书脊感 */
[data-theme="darkacademia"] .card{border:1px solid var(--border);border-left:3px solid var(--accent)}
[data-theme="darkacademia"] .card-title{letter-spacing:.02em}
[data-theme="darkacademia"] .card-foot{border-top-color:var(--border)}
[data-theme="darkacademia"] .link-btn::before{content:"✦";color:var(--accent)}

/* slate：发丝线分隔 + 极简计数徽章 */
[data-theme="slate"] .card{border-left:2px solid var(--accent)}
[data-theme="slate"] .card-cat{font-family:"JetBrains Mono",monospace;font-size:10px}

/* ============================================================
   动画：卡片入场
   ============================================================ */
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.card{animation:pop .3s ease backwards}
.card:nth-child(1){animation-delay:.02s}
.card:nth-child(2){animation-delay:.06s}
.card:nth-child(3){animation-delay:.10s}
.card:nth-child(4){animation-delay:.14s}
.card:nth-child(5){animation-delay:.18s}
.card:nth-child(6){animation-delay:.22s}
.card:nth-child(7){animation-delay:.26s}
.card:nth-child(8){animation-delay:.30s}

/* ============================================================
   响应式
   ============================================================ */
.menu-toggle{display:none}
@media(max-width:860px){
  .sidebar{
    position:fixed;left:0;top:60px;z-index:50;transform:translateX(-100%);
    transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.1);
  }
  .sidebar.open{transform:translateX(0)}
  .main{padding:20px 16px}
  .menu-toggle{
    display:inline-flex;position:fixed;left:14px;top:74px;z-index:60;
    background:var(--card);border:1px solid var(--border);border-radius:8px;
    width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;font-size:18px;
  }
  .topbar{padding:14px 16px}
  .theme-switcher .label{display:none}
}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40}
.backdrop.show{display:block}

/* sticky 主题在窄屏关掉旋转，避免溢出 */
@media(max-width:860px){
  [data-theme="sticky"] .card:nth-child(odd),
  [data-theme="sticky"] .card:nth-child(even){transform:none}
}
</style>
</head>
<body>

<!-- 顶部栏 + 主题切换 -->
<div class="topbar">
  <h2 class="brand">dev<span class="dot">·</span>drawer</h2>
  <div class="theme-switcher" id="themeSwitcher">
    <button class="theme-trigger" onclick="toggleThemePanel(event)">
      <span class="swatch"></span>
      <span id="themeName">便利贴</span>
      <span class="caret">▼</span>
    </button>
    <div class="theme-panel" onclick="event.stopPropagation()">
      <div class="theme-panel-group">
        <p class="theme-panel-title">经典风格</p>
        <div class="theme-panel-grid">
          <div class="theme-opt active" data-t="sticky" onclick="setTheme('sticky')"><span class="dot"></span><span class="emoji">📝</span><span class="name">便利贴</span></div>
          <div class="theme-opt" data-t="paper" onclick="setTheme('paper')"><span class="dot"></span><span class="emoji">📔</span><span class="name">牛皮纸本</span></div>
          <div class="theme-opt" data-t="morandi" onclick="setTheme('morandi')"><span class="dot"></span><span class="emoji">🎨</span><span class="name">莫兰迪</span></div>
          <div class="theme-opt" data-t="neon" onclick="setTheme('neon')"><span class="dot"></span><span class="emoji">🌃</span><span class="name">霓虹深色</span></div>
          <div class="theme-opt" data-t="clean" onclick="setTheme('clean')"><span class="dot"></span><span class="emoji">⚪</span><span class="name">极简白</span></div>
        </div>
      </div>
      <div class="theme-panel-group">
        <p class="theme-panel-title">配色库精选 · ui-ux-pro-max</p>
        <div class="theme-panel-grid">
          <div class="theme-opt" data-t="sage" onclick="setTheme('sage')"><span class="dot"></span><span class="emoji">🌿</span><span class="name">鼠尾草</span></div>

          <div class="theme-opt" data-t="periwinkle" onclick="setTheme('periwinkle')"><span class="dot"></span><span class="emoji">💜</span><span class="name">长春花</span></div>
          <div class="theme-opt" data-t="darkacademia" onclick="setTheme('darkacademia')"><span class="dot"></span><span class="emoji">📚</span><span class="name">暗黑学院</span></div>
          <div class="theme-opt" data-t="slate" onclick="setTheme('slate')"><span class="dot"></span><span class="emoji">⚙️</span><span class="name">石板灰</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open');document.querySelector('.backdrop').classList.toggle('show')">☰</div>
<div class="backdrop" onclick="document.querySelector('.sidebar').classList.remove('open');this.classList.remove('show')"></div>

<div class="layout">
  <aside class="sidebar">
    <p class="tagline">个人收藏夹 · md 手记 / html 展示</p>
    <input class="search" id="search" type="text" placeholder="🔍 搜索标题 / 标签 / 内容…" oninput="render()">
    <div id="nav"></div>
  </aside>

  <main class="main">
    <div class="header">
      <h1 id="view-title">全部</h1>
      <span class="meta" id="view-count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
/* ============================================================
   数据区 —— md 为源，本数组由 ZCode 按 notes/ 下的 md 重建。
   ============================================================ */
const NOTES = [

    links: { "GitHub": "https://github.com/mattpocock/skills" },
    source: "notes/skills/general/mattpocock-skills.md"
  },
  {
    title: "vercel-react-best-practices",

    summary: "Vercel 官方维护的 React/Next.js 最佳实践 skill。70 条规则 / 8 大分类（消除瀑布流、包体积、服务端、重渲染、JS 性能…），每条带正反代码示例。社区说的 React Best Practices 就是指它。已装本地全局可用。",
    links: {

  },
  {

    summary: "20MB 单文件驾驭 70+ 种数据库，内置 AI SQL 助手 + MCP 协议。相当于把 Navicat/DBeaver 瘦身到 20MB，还让 AI 助手直接复用配好的连接查数据。Tauri 2 + Rust，零依赖，Apache-2.0 开源。",
    links: {

    summary: "让 LLM 直接连 MySQL 跑 SQL 的 MCP（社区实现）。配好连接后 AI 可查 schema、执行查询，省掉手写 Mock 数据。默认建议只读，生产库连只读副本。",
    links: {
      "mcp-server-mysql": "https://github.com/benborla/mcp-server-mysql"
    },
    source: "notes/tools/mcp/mysql.md"
  },
  {

  },
  {

    tags: ["mcp","fetch","web","网页抓取","官方"],
    summary: "MCP 官方网页抓取 server，URL → Markdown，省 token。ZCode/Claude Code 多已内置 WebFetch/WebSearch，通常不用装，纯 MCP 客户端用它补齐抓取能力。",
    links: {
      "MCP Servers": "https://github.com/modelcontextprotocol/servers"
    },
    source: "notes/tools/mcp/fetch.md"
  },
  {
    title: "用 Mermaid 替代 ASCII 连线图",
    category: "skills/tips",
    tags: ["mermaid","diagram","ascii","可视化","技巧"],
    summary: "ASCII 连线图换字体或缩放就错位。改用 Mermaid：渲染成清晰矢量图，可缩放、可右键存 SVG/PNG，GitHub/Markdown 原生支持。",
    links: {

      "Live Editor": "https://mermaid.live/"
    },
    source: "notes/skills/tips/mermaid-vs-ascii.md"
  }
];

/* 分类树 */
const CATEGORY_TREE = {
  "skills": {
    label: "Skills",
    children: {
      "skills/frontend": "前端",
      "skills/backend":  "后端",
      "skills/general":  "通用 / 方法论",
      "skills/tips":     "技巧"
    }
  },
  "tools":     { label: "工具 / 网站", children: {
    "tools/mcp": "MCP 服务"
  } },
  "articles":  { label: "文章 / 资料", children: null },
  "snippets":  { label: "代码 / 技巧", children: null }
};

let currentFilter = "all";

/* 主题名映射（用于 trigger 按钮显示） */
const THEME_NAMES = {
  sticky:"便利贴", paper:"牛皮纸本", morandi:"莫兰迪", neon:"霓虹深色", clean:"极简白",
  sage:"鼠尾草", ocean:"海洋青", terracotta:"陶土赤", periwinkle:"长春花",
  darkacademia:"暗黑学院", slate:"石板灰"
};

/* 主题切换 + 持久化 */
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll(".theme-opt").forEach(d =>
    d.classList.toggle("active", d.dataset.t === t)
  );
  const nameEl = document.getElementById("themeName");
  if(nameEl) nameEl.textContent = THEME_NAMES[t] || t;
  try{ localStorage.setItem("sn-theme", t); }catch(e){}
}
/* 打开/关闭主题面板 */
function toggleThemePanel(e){
  if(e) e.stopPropagation();
  document.getElementById("themeSwitcher").classList.toggle("open");
}
/* 点击面板外部关闭 */
document.addEventListener("click", () => {
  document.getElementById("themeSwitcher")?.classList.remove("open");
});
(function initTheme(){
  let t = "sticky";
  try{ t = localStorage.getItem("sn-theme") || "sticky"; }catch(e){}
  setTheme(t);
})();

/* 工具函数 */
function countFor(category){
  if(category === "all") return NOTES.length;
  return NOTES.filter(n => n.category === category || n.category.startsWith(category + "/")).length;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* 渲染侧栏 */
function renderNav(){
  const nav = document.getElementById("nav");
  let html = `<div class="nav-group">
    <div class="nav-item ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">
      <span>全部</span><span class="count">${countFor('all')}</span>
    </div></div>`;
  for(const [key, conf] of Object.entries(CATEGORY_TREE)){
    const cnt = countFor(key);
    if(cnt === 0) continue;
    html += `<div class="nav-group"><div class="nav-title">${conf.label}</div>
      <div class="nav-item ${currentFilter===key?'active':''}" onclick="setFilter('${key}')">
        <span>全部 ${conf.label}</span><span class="count">${cnt}</span>
      </div>`;
    if(conf.children){
      html += `<div class="nav-sub">`;
      for(const [sub, label] of Object.entries(conf.children)){
        const c = countFor(sub);
        if(c === 0) continue;
        html += `<div class="nav-item ${currentFilter===sub?'active':''}" onclick="setFilter('${sub}')">
          <span>${label}</span><span class="count">${c}</span></div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  nav.innerHTML = html;
}

/* 渲染卡片 */
function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  let list = NOTES.slice();
  if(currentFilter !== "all"){
    list = list.filter(n => n.category === currentFilter || n.category.startsWith(currentFilter + "/"));
  }
  if(q){
    list = list.filter(n => {
      const hay = [n.title, n.summary, n.category, ...(n.tags||[])].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  const title = document.getElementById("view-title");
  const countEl = document.getElementById("view-count");
  if(q) title.textContent = `搜索："${q}"`;
  else if(currentFilter === "all") title.textContent = "全部";
  else {
    let label = currentFilter;
    for(const [key, conf] of Object.entries(CATEGORY_TREE)){
      if(currentFilter === key) label = conf.label;
      if(conf.children && conf.children[currentFilter]) label = conf.label + " · " + conf.children[currentFilter];
    }
    title.textContent = label;
  }
  countEl.textContent = `${list.length} 条`;

  const grid = document.getElementById("grid");
  if(list.length === 0){
    grid.innerHTML = `<div class="empty"><div class="big">🗂️</div>没有匹配的便利贴。<br>试试别的关键词，或在 notes/ 下新建一个 md。</div>`;
    return;
  }
  grid.innerHTML = list.map(n => {
    const tags = (n.tags||[]).map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join("");
    const links = n.links ? Object.entries(n.links).map(([k,v]) =>
      `<a class="link-btn" href="${escapeHtml(v)}" target="_blank" rel="noopener">${escapeHtml(k)}</a>`
    ).join("") : "";
    return `<article class="card">
      <div class="card-head">
        <h3 class="card-title">${escapeHtml(n.title)}</h3>
        <span class="card-cat">${escapeHtml(n.category)}</span>
      </div>
      <p class="card-summary">${escapeHtml(n.summary)}</p>
      ${tags ? `<div class="card-tags">${tags}</div>` : ""}
      ${links ? `<div class="card-links">${links}</div>` : ""}
      <div class="card-foot">📄 源文件：<a href="${escapeHtml(n.source)}" target="_blank">${escapeHtml(n.source)}</a></div>
    </article>`;
  }).join("");
}

function setFilter(cat){
  currentFilter = cat;
  renderNav(); render();
  document.querySelector(".sidebar").classList.remove("open");
  document.querySelector(".backdrop").classList.remove("show");
}

renderNav();
render();
</script>
</body>
</html>
